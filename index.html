<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BilalAI 1.0</title>
<style>
  :root {
    --bg: #0f1117; --panel: #1a1d27; --panel2: #232734;
    --text: #e6e8ee; --muted: #9aa0b0; --accent: #6c8cff;
    --user: #2b3a67; --bot: #232734; --ok: #3fb96b; --warn: #e0a33e; --err: #e05c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; background: var(--panel); border-bottom: 1px solid #2a2e3c;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  .badge {
    font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--panel2);
    color: var(--muted); border: 1px solid #2a2e3c;
  }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.err { color: var(--err); border-color: var(--err); }
  #statusText { font-size: 13px; color: var(--muted); }
  #banner {
    padding: 10px 20px; font-size: 13px; background: #2a2416; color: var(--warn);
    border-bottom: 1px solid #3a3320; display: none;
  }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
    max-width: 860px; width: 100%; margin: 0 auto;
  }
  .msg { padding: 12px 15px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { background: var(--user); align-self: flex-end; max-width: 80%; }
  .msg.bot { background: var(--bot); align-self: flex-start; max-width: 80%; border: 1px solid #2a2e3c; }
  .msg .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .msg.error { background: #3a2020; color: #f0b0b0; align-self: center; font-size: 13px; }
  footer {
    padding: 14px 20px; background: var(--panel); border-top: 1px solid #2a2e3c;
  }
  .input-row { display: flex; gap: 10px; max-width: 860px; margin: 0 auto; }
  textarea {
    flex: 1; resize: none; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2e3c;
    background: var(--panel2); color: var(--text); font-size: 14px; font-family: inherit; height: 48px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button {
    padding: 0 22px; border-radius: 10px; border: none; background: var(--accent);
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <h1>BilalAI 1.0</h1>
    <span id="stateBadge" class="badge">Yukleniyor</span>
    <span id="statusText"></span>
  </header>
  <div id="banner"></div>
  <div id="chat"></div>
  <footer>
    <div class="input-row">
      <textarea id="input" placeholder="Mesajinizi yazin... (Enter: gonder, Shift+Enter: yeni satir)"></textarea>
      <button id="send">Gonder</button>
    </div>
    <div class="hint">BilalAI 1.0 - 118M parametreli yerel dil modeli. Cevaplar yerel checkpoint'ten uretilir.</div>
  </footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const badge = document.getElementById('stateBadge');
const statusText = document.getElementById('statusText');
const banner = document.getElementById('banner');
let history = [];
let ready = false;

const STATE_LABELS = {
  loading: ["Yukleniyor", ""],
  model_not_found: ["Model yok", "err"],
  ready: ["Hazir", "ok"],
  mismatch: ["Uyumsuz", "err"],
  error: ["Hata", "err"],
};

function addMessage(role, text, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = meta;
    div.appendChild(m);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function refreshStatus() {
  try {
    const res = await fetch('/api/status');
    const s = await res.json();
    const [label, cls] = STATE_LABELS[s.state] || [s.state, ""];
    badge.textContent = s.generating ? "Uretiliyor" : label;
    badge.className = 'badge ' + (s.generating ? 'warn' : cls);
    statusText.textContent = `adim: ${s.global_step} | cihaz: ${s.device}`;
    ready = s.ready;
    if (s.state === 'model_not_found') {
      banner.style.display = 'block';
      banner.textContent = 'Model henuz egitilmedi. Once egitim calistirilmali (train.py).';
    } else if (s.ready && !s.trained) {
      banner.style.display = 'block';
      banner.textContent = 'Model yuklendi ancak henuz egitilmedi (rastgele agirlıklar). Cevaplar anlamli olmayabilir.';
    } else if (s.ready && s.trained && s.global_step < 1000) {
      banner.style.display = 'block';
      banner.textContent = `Egitim suruyor (adim ${s.global_step}). Model henuz olgunlasmadi; cevaplar sinirli olabilir.`;
    } else {
      banner.style.display = 'none';
    }
    sendBtn.disabled = !ready;
  } catch (e) {
    badge.textContent = "Baglanti yok"; badge.className = "badge err";
  }
}

async function send() {
  const text = input.value.trim();
  if (!text || !ready) return;
  input.value = '';
  addMessage('user', text);
  history.push({role: 'user', content: text});
  sendBtn.disabled = true;
  const thinking = addMessage('bot', '...');
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, history: history.slice(0, -1)})
    });
    const data = await res.json();
    thinking.remove();
    if (!res.ok) {
      addMessage('error', data.error || 'Bir hata olustu.');
    } else {
      const reply = data.reply || '(bos cikti)';
      const meta = `stop: ${data.stop_reason} | token: ${data.num_new_tokens}` +
                   (data.truncated ? ' | baglam kirpildi' : '');
      addMessage('bot', reply, meta);
      history.push({role: 'assistant', content: reply});
    }
  } catch (e) {
    thinking.remove();
    addMessage('error', 'Sunucuya ulasilamadi.');
  } finally {
    sendBtn.disabled = !ready;
    refreshStatus();
  }
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

addMessage('bot', 'Merhaba! Ben BilalAI 1.0. Sana nasil yardimci olabilirim?');
refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
